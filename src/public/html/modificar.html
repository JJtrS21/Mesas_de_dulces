<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modificar evento</title>
  <link rel="stylesheet" href="/css/styles.css"> <!-- Corregí "style.css" a "styles.css" -->
</head>
<body>

  <!-- 🔹 Encabezado -->
  <header class="site-header">
    <img src="/img/logo-chef.png" alt="Logo" class="logo"> <!-- Corregí la ruta de la imagen -->
    <h1>Servicios de Catering</h1>
    <p>Modificar evento existente</p>
  </header>

  <!-- 🔹 Contenido principal -->
  <main class="detalle-container">
    <section class="card">
      <h2>Modificar evento</h2>

      <form id="formModificar" style="display:none;">
        <label for="nombreCliente">Nombre del cliente:</label>
        <input type="text" id="nombreCliente" required>

        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" required>

        <label for="ubicacion">Ubicación:</label>
        <input type="text" id="ubicacion" required>

        <label>Productos</label>
        <div id="listaProductos"> <!-- Cambié <ul> por <div> -->
          <p>Cargando productos...</p>
        </div>
        
        <label for="personas">Número de personas:</label>
        <input type="number" id="personas" min="30" required>

        <label for="precioPersona">Precio por persona:</label>
        <input type="number" id="precioPersona" readonly>

        <!-- <label for="estatus">Estatus:</label>
        <input type="text" id="estatus" required> -->
        
        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" placeholder="Detalles adicionales..."></textarea>

        <div class="botones">
          <button type="submit" class="btn-primary">Guardar cambios</button>
          <a href="/" class="btn-link">Volver al inicio</a>
        </div>
      </form>
    </section>
  </main>

  <!-- 🔹 Footer -->
  <footer>
    <p class="contacto">© 2025 Nohelly Armas Morgado — Servicios de Catering</p>
  </footer>

  <!-- 🔹 Script -->
  <script src="/js/modificar.js"></script>
</body>
</html>
