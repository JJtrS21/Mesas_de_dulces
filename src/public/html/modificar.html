<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modificar evento</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <header class="site-header">
    <div class="branding">
      <a href="/" class="logo-link">
        <img src="/img/logo-chef.png" alt="Logo Chef" class="logo">
      </a>
      <div class="brand-text">
        <h1>Nohelly Armas Morgado</h1>
        <p>Servicios de Catering</p>
      </div>
    </div>

    <nav class="nav-acciones">
      <a href="/html/inventario.html" class="nav-btn">📔 Catálogo</a>
      <a href="/html/producto-nuevo.html" class="nav-btn">🧁 Nuevo producto</a>
      <a href="/html/evento-nuevo.html" class="nav-btn">🎉 Nuevo evento</a>
      <a href="/html/eventos-historial.html" class="nav-btn">📜 Historial de eventos</a>
    </nav>
  </header>

  <main>
    <h2>Modificar evento</h2>
    <section>

      <form id="formModificar" style="display:none;">

        <label for="nombreCliente">Nombre del cliente:</label>
        <input type="text" id="nombreCliente" required>

        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" required>

        <label for="ubicacion">Ubicación:</label>
        <input type="text" id="ubicacion" required>

        <!-- Estado del evento (de main) -->
        <label>Estado del evento</label>
        <select id="estado" required>
          <option value="Pendiente">Pendiente</option>
          <option value="Completado">Completado</option>
          <option value="Cancelado">Cancelado</option>
        </select>

        <!-- Productos (div, como en Serggi-Nueva-v) -->
        <label>Selecciona los productos</label>
        <div id="listaProductos">
          <p>Cargando productos...</p>
        </div>

        <!-- Campos adicionales de Serggi-Nueva-v -->
        <label for="personas">Número de personas:</label>
        <input type="number" id="personas" min="30" required>

        <label for="precioPersona">Precio por persona:</label>
        <input type="number" id="precioPersona" readonly>

        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" placeholder="Detalles adicionales..."></textarea>

        <div class="botones">
          <button type="submit" class="btn-primary">Guardar cambios</button>
          <a href="/" class="btn-link">Volver al inicio</a>
        </div>

      </form>
    </section>
  </main>

  <footer>
    <p class="contacto">© 2025 Nohelly Armas Morgado — Servicios de Catering</p>
  </footer>

  <script src="/js/modificar.js"></script>
</body>
</html>
