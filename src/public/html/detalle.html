<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Detalles del Evento</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <header class="site-header">
    <div class="branding">
      <a href="/" class="logo-link">
        <img src="/img/logo-chef.png" alt="Logo Chef" class="logo">
      </a>
      <h1>Nohelly Armas Morgado</h1>
      <p>Servicios de Catering</p>
    </div>
  </header>

  <main class="detalle-container">
    <h2 id="nombreCliente">Cargando...</h2>

    <section id="infoBasica" class="card">
      <p><strong>Fecha:</strong> <span id="fecha"></span></p>
      <p><strong>Ubicación:</strong> <span id="ubicacion"></span></p>
      <p><strong>Estado:</strong> <span id="estado"></span></p>
      <div id="accionesEstado" class="acciones-estado"></div>
    </section>

    <section id="productos" class="card">
      <h3>Productos</h3>
      <ul id="listaProductos"></ul>
    </section>

    <section id="descripcion" class="card">
      <h3>Descripción</h3>
      <p id="textoDescripcion"></p>
    </section>

    <div class="botones">
      <a href="/" class="btn-link">Volver al inicio</a>
      <a href="/html/eventos-historial.html" class="btn-link">Ver historial completo</a>
      <button id="editar" class="btn-primary">Modificar este evento</button>
    </div>

  </main>

  <footer>
    <p>© 2025 Nohelly Armas Morgado — Servicios de Catering</p>
  </footer>

  <script src="/js/detalle.js"></script>
</body>
</html>
