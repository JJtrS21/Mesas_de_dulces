<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Producto</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

  <header class="site-header">
    <div class="branding">
      <a href="/" class="logo-link">
        <img src="/img/logo-chef.png" alt="Logo Chef" class="logo">
      </a>
      <div class="brand-text">
        <h1>Nohelly Armas Morgado</h1>
        <p>Servicios de Catering</p>
      </div>
    </div>

    <nav class="nav-acciones">
      <a href="/html/inventario.html" class="nav-btn">📔 Catálogo</a>
      <a href="/html/producto-nuevo.html" class="nav-btn">🧁 Nuevo producto</a>
      <a href="/html/evento-nuevo.html" class="nav-btn">🎉 Nuevo evento</a>
      <a href="/html/eventos-historial.html" class="nav-btn">📜 Historial de eventos</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Editar Producto</h2>

      <form id="formEditarProducto">
        <label for="nombre">Nombre del producto:</label>
        <input type="text" id="nombre" required>

        <label for="precio">Precio:</label>
        <input type="number" id="precio" min="0" step="0.01" required>

        <label for="categoria">Categoría:</label>
        <select id="categoria" required>
          <option value="">-- Selecciona una categoría --</option>
          <option value="Bocadillos Salados">Bocadillos Salados</option>
          <option value="Plato Fuerte">Plato Fuerte</option>
          <option value="Postre">Postre</option>
          <option value="Entrada">Entrada</option>
        </select>

        <div class="botones">
          <button type="submit" class="btn-primary">Guardar Cambios</button>
          <button type="button" id="btnEliminarProducto" class="btn-detalle" 
            style="background:#e74c3c; border:none;">
          🗑 Eliminar producto
        </button>
          <a href="/html/inventario.html" class="btn-link">Cancelar</a>
        </div>
      </form>

      <a href="/" class="btn-link">Volver al inicio</a>

    </section>
  </main>

  <footer>
    <p>© 2025 Nohelly Armas Morgado — Servicios de Catering</p>
  </footer>

  <script src="/js/editar-producto.js"></script>
</body>
</html>
