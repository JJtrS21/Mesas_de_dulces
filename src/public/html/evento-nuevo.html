<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Agregar nuevo evento</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Encabezado con branding -->
  <header class="site-header">
    <div class="branding">
      <a href="/" class="logo-link">
        <img src="/img/logo-chef.png" alt="Logo Chef" class="logo">
      </a>
      <h1>Nohelly Armas Morgado</h1>
      <p>Servicios de Catering</p>
    </div>
  </header>

  <main>
    <form id="formAgregar">
      <h2>Agregar nuevo evento</h2>

      <label>Nombre del cliente</label>
      <input type="text" id="nombreCliente" required>

      <label>Fecha</label>
      <input type="date" id="fecha" required>

      <label>Ubicación</label>
      <input type="text" id="ubicacion" required>

      <!-- Estado (select de la rama main pero mantiene la idea de "estatus") -->
      <label>Estado del evento</label>
      <select id="estado" required>
        <option value="Pendiente">Pendiente</option>
        <option value="Completado">Completado</option>
        <option value="Cancelado">Cancelado</option>
      </select>

      <!-- Número de personas (agregado de Serggi-Nueva-v) -->
      <label>Número de personas</label>
      <input type="number" id="personas" min="30" required>

      <!-- Lista de productos -->
      <label>Selecciona los productos</label>
      <ul id="listaProductos">
        <p>Cargando productos...</p>
      </ul>

      <label>Descripción</label>
      <textarea id="descripcion"></textarea>

      <div class="botones">
        <button type="submit" class="btn-primary">Guardar evento</button>
        <a href="/" class="btn-link">Volver al inicio</a>
      </div>
    </form>
  </main>

  <footer>
    <p>© 2025 Nohelly Armas Morgado — Servicios de Catering</p>
  </footer>

  <script src="/js/evento-nuevo.js"></script>
</body>
</html>
