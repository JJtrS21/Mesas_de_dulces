<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario de Dulces</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="branding">
      <a href="/" class="logo-link">
        <img src="/img/logo-chef.png" alt="Logo Chef" class="logo">
      </a>
      <div class="brand-text">
        <h1>Nohelly Armas Morgado</h1>
        <p>Servicios de Catering</p>
      </div>
    </div>

    <nav class="nav-acciones">
      <a href="/html/inventario.html" class="nav-btn">📔 Catálogo</a>
      <a href="/html/producto-nuevo.html" class="nav-btn">🧁 Nuevo producto</a>
      <a href="/html/evento-nuevo.html" class="nav-btn">🎉 Nuevo evento</a>
      <a href="/html/eventos-historial.html" class="nav-btn">📜 Historial de eventos</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Catálogo de productos</h2>

      <!-- Controles de búsqueda -->
      <div class="controles">
        <input type="text" id="buscarInput" placeholder="Buscar producto...">
        <select id="filtroCategoria">
          <option value="">Todas las categorías</option>
        </select>
      </div>

      <table class="tabla-inventario">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Precio</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaInventario"></tbody>
      </table>

      <p id="mensaje" style="color: green; font-weight: bold;"></p>
    </section>

    <!--Boton-->
    <div class="botones">
      <a href="/" class="btn-link">Volver al inicio</a>
    </div>
  </main>

  <footer>
    <p>© 2025 Nohelly Armas Morgado — Servicios de Catering</p>
  </footer>

  <!-- Script de inventario -->
  <script src="/js/inventario.js"></script>
</body>
</html>
